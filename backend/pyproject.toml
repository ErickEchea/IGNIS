[project]
name = "ignis"
version = "0.1.0"
description = "IGNIS - Space Fire Intelligence: evidence engine for partial-gravity fire safety"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pint>=0.24",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "google-genai>=1.0",
]

[project.scripts]
ignis-pipeline = "ignis.pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ignis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ignis"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "fastembed.*", "pdfplumber.*", "pypdfium2.*", "onnxruntime.*", "pint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: test requires network access (skipped in CI by default)",
    "models: test requires downloaded ONNX models",
]
