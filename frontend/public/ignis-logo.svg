<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">IGNIS logo: a flame encircled by an orbit</title>
  <defs>
    <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8431a"/>
      <stop offset="0.55" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#fff1d0"/>
    </linearGradient>
    <clipPath id="front" clipPathUnits="userSpaceOnUse">
      <rect x="-10" y="36" width="84" height="40"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#15181c"/>
  <!-- orbit: back half (behind the flame) -->
  <g transform="rotate(-18 32 36)">
    <ellipse cx="32" cy="36" rx="27" ry="8" fill="none" stroke="#ffb547" stroke-opacity="0.45" stroke-width="1.8"/>
  </g>
  <!-- flame -->
  <path fill="url(#outer)" d="M32 7c5 10 14 16 14 29 0 9.4-6.3 16-14 16s-14-6.6-14-15c0-7 3.8-11 7-16 .8 5.6 3.4 7.6 6 8-1.4-7.4-1-14.4 1-22z"/>
  <path fill="url(#inner)" d="M32.4 26c2.8 6 6.6 8.6 6.6 15 0 4.8-3.1 8-7 8s-7-3-7-7c0-5 4.2-8 7.4-16z"/>
  <!-- orbit: front half (over the flame) + moon -->
  <g transform="rotate(-18 32 36)" clip-path="url(#front)">
    <ellipse cx="32" cy="36" rx="27" ry="8" fill="none" stroke="#ffb547" stroke-width="2.2"/>
  </g>
  <g transform="rotate(-18 32 36)">
    <circle cx="52.7" cy="41.1" r="2.7" fill="#d9d5c9" stroke="#15181c" stroke-width="1"/>
  </g>
</svg>
