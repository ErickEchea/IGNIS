  # Documented search queries (systematic, reproducible). Top results per query are harvested.
  queries:
    - "partial gravity flame spread"
    - "lunar gravity flammability"
    - "Martian gravity flammability"
    - "spacecraft fire safety"
    - "Saffire flame spread"
    - "Burning and Suppression of Solids"
    - "microgravity flame spread oxygen concentration"
    - "material flammability microgravity"
    - "Solid Fuel Ignition and Extinction"
    - "droplet flame extinguishment microgravity"
    - "exploration atmosphere oxygen pressure flammability"
  per_query: 25
  # Public-use per NTRS, but the PDF itself carries an AIAA preprint notice asking not to cite or
  # reproduce it without permission: kept as metadata only (not full-text indexed, never quoted).
  exclude_full_text:
    - {id: "20010059376", reason: "AIAA preprint notice on the PDF title page"}

