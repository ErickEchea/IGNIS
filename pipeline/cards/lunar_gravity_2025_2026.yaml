    material: "SIBAL cotton-fiberglass composite fabric"
    material_class: "cotton-fiberglass fabric (charring)"
    geometry: fabric
    o2: {value: 20, unit: "%", dimension: fraction, uncertainty_kind: unknown}
    pressure: {value: 1, unit: atm, dimension: pressure}
    flow_direction: buoyant_downward
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio, uncertainty_kind: platform_jitter}
    platform: suborbital_spin
    reduced_gravity_duration_s: 150
    measured_variable: flame_tip_spread_rate
    value: {value: 1.1, unit: mm/s, dimension: velocity, uncertainty_kind: unknown}
    comparison_1g: {value: 2.8, unit: mm/s, dimension: velocity, uncertainty_kind: unknown}
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: medium
    confidence_rationale: "Single flight; linear fits; 1-g tracking noted as less clean by the team (slide 23)."
    caveats:
      - "1-g spread fits are approximate because of tracking fluctuations (slide 25)."
    campaign_id: LUCI-NEW-SHEPARD-2025
    tags: [partial_gravity, lunar, long_duration, flame_spread]
    provenance:
      source_id: NTRS-20250010653
      page: 33
      locator: "Slide 33, SIBAL flame spread fit comparison"
      quote: "Flame Tip 1.1 2.8 .39"
      extraction: llm_assisted_quote_verified

  - id: LUCI2025-PMMA-TIP-SPREAD
    claim: "A 4-mm PMMA rod burning upward in air had a flame tip spread rate of 0.15 cm/s in simulated lunar gravity versus 0.40 cm/s in 1 g (ratio 0.38), from linear fits."
    material: "PMMA (acrylic) rod, 4 mm diameter"
    material_class: "PMMA (non-charring, melting)"
    geometry: rod
    thickness: {value: 4, unit: mm, dimension: length}
    o2: {value: 20, unit: "%", dimension: fraction, uncertainty_kind: unknown}
    pressure: {value: 1, unit: atm, dimension: pressure}
    flow_direction: buoyant_upward
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio, uncertainty_kind: platform_jitter}
    platform: suborbital_spin
    reduced_gravity_duration_s: 150
    measured_variable: flame_tip_spread_rate
    value: {value: 0.15, unit: cm/s, dimension: velocity, uncertainty_kind: unknown}
    comparison_1g: {value: 0.40, unit: cm/s, dimension: velocity, uncertainty_kind: unknown}
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: medium
    confidence_rationale: "Single flight; Coriolis force pulls the flame off the rod axis (slide 17)."
    caveats:
      - "Coriolis force pulls the flame away from the fuel axis (slide 17)."
      - "Gravity level started dropping at t = 125 s (slide 43)."
    campaign_id: LUCI-NEW-SHEPARD-2025
    tags: [partial_gravity, lunar, long_duration, flame_spread]
    provenance:
      source_id: NTRS-20250010653
      page: 36
      locator: "Slide 36, PMMA flame tip comparison"
      quote: "Ratio .15 .40 .38"
      extraction: llm_assisted_quote_verified

  - id: LUCI2025-PMMA-O2-DEPLETION
    claim: "During the lunar-gravity PMMA burn the chamber O2 fell from 20% to 14.3% while the flame was still present, then rose back to 15.8% as gravity (and buoyant flow) decreased at 125 s. This is an O2 history, not an extinction limit."
    material: "PMMA (acrylic) rod, 4 mm diameter"
    material_class: "PMMA (non-charring, melting)"
    geometry: rod
    pressure: {value: 1, unit: atm, dimension: pressure}
    flow_direction: buoyant_upward
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio, uncertainty_kind: platform_jitter}
    platform: suborbital_spin
    reduced_gravity_duration_s: 150
    measured_variable: chamber_o2_minimum_during_burn
    value: {value: 14.3, unit: "%", dimension: fraction, uncertainty_kind: unknown}
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: low
    confidence_rationale: "Chamber-average O2 from slides; the team does not report a lunar-g extinction limit on these slides."
    caveats:
      - "Not a flammability limit: the burn ended for several reasons, including the gravity drop at 125 s."
      - "The matching 1-g PMMA burn went from 21% to 14.5% O2 (slide 31)."
    campaign_id: LUCI-NEW-SHEPARD-2025
    tags: [partial_gravity, lunar, oxygen]
    provenance:
      source_id: NTRS-20250010653
      page: 22
      locator: "Slide 22"
      quote: "O2% decreases from 20% to 14.3%."
      extraction: llm_assisted_quote_verified

