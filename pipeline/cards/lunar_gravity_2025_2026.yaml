# Ferkul, Kralik & Liao (2026) "Material Flammability at Lunar and Martian Gravity", LPSC 2026
#   extended abstract, NTRS 20260000646 (GOV_PERMITTED).
# Ferkul, Johnston, Kralik & Liao (2025) "Lunar Combustion Investigation: Flammability Results from a
#   Rotating Sounding Rocket", ASGSR 2025 presentation, NTRS 20250010653 (GOV_PERMITTED).
#   LUCI flew on Blue Origin New Shepard (launch 4 Feb 2025), 11 rpm at 1.22 m radius.

cards:
  # ---------------------------------------------------------------- LUCI measurements (slides)
  - id: LUCI2025-SIBAL-BASE-SPREAD
    claim: "In simulated lunar gravity (spinning New Shepard), the flame base of SIBAL cotton-fiberglass fabric burning downward in air spread at 0.9 mm/s versus 1.5 mm/s in the matching 1-g burn (ratio 0.6), from linear fits."
    material: "SIBAL cotton-fiberglass composite fabric"
    material_class: "cotton-fiberglass fabric (charring)"
    geometry: fabric
    o2: {value: 20, unit: "%", dimension: fraction, uncertainty_kind: unknown}
    pressure: {value: 1, unit: atm, dimension: pressure}
    flow_direction: buoyant_downward
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio, uncertainty_kind: platform_jitter}
    platform: suborbital_spin
    reduced_gravity_duration_s: 150
    measured_variable: flame_spread_rate
    value: {value: 0.9, unit: mm/s, dimension: velocity, uncertainty_kind: unknown}
    comparison_1g: {value: 1.5, unit: mm/s, dimension: velocity, uncertainty_kind: unknown}
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: medium
    confidence_rationale: "Single flight; rates from linear fits shown on slides; Coriolis effects acknowledged by the team."
    caveats:
      - "One flight, one sample per material; no repeat tests."
      - "Rotating platform: Coriolis force distorts the flame (slide 17)."
      - "O2 fell from ~20% to ~18% during the burn (slide 42)."
    campaign_id: LUCI-NEW-SHEPARD-2025
    tags: [partial_gravity, lunar, long_duration, flame_spread]
    provenance:
      source_id: NTRS-20250010653
      page: 33
      locator: "Slide 33, SIBAL flame spread fit comparison"
      quote: "Flame Base .9 1.5 .6"
      extraction: llm_assisted_quote_verified

