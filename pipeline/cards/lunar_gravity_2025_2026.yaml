  - id: LPSC2026-MIN-O2-NEAR-LUNAR
    claim: "Related work suggests the oxygen concentration needed for flammability reaches a minimum near lunar gravity, and early work found flame spread rate versus gravity peaks there (Sacksteder & T'ien 1994)."
    material: "thin solid fuels (general)"
    material_class: "multiple"
    geometry: other
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio}
    platform: model
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Summary of earlier numerical and experimental evidence; the minimum location is suggested, not precisely measured."
    campaign_id: LPSC-2026-REVIEW
    tags: [partial_gravity, u_shaped_boundary, h2_evidence]
    provenance:
      source_id: NTRS-20260000646
      page: 1
      locator: "Current Knowledge"
      quote: "Related work suggests that oxygen concentration for flammability reaches a minimum value in the vicinity of g = g Lunar."
      extraction: llm_assisted_quote_verified

  - id: LPSC2026-HABITAT-HAZARD
    claim: "Because Moon and Mars habitats will likely use sub-atmospheric pressure with elevated oxygen, NASA researchers expect partial-g fire to be substantially worse than in 0 g and potentially worse than in 1 g. This is an expectation, not yet a measured result."
    material: "habitat materials (general)"
    material_class: "multiple"
    geometry: other
    gravity_range_g0: [0.165, 0.38]
    platform: model
    measured_variable: hazard_expectation
    data_type: DERIVED
    epistemic: HYPOTHESIS
    confidence: low
    confidence_rationale: "Stated as an expectation by the authors; long-duration partial-g data to confirm it do not yet exist."
    campaign_id: LPSC-2026-REVIEW
    tags: [h2_evidence, habitat, exploration_atmosphere]
    provenance:
      source_id: NTRS-20260000646
      page: 1
      locator: "Current Knowledge"
      quote: "partial-g fire in an extraterrestrial habitat is a real hazard that is expected to be substantially worse than in 0-g and potentially worse than even 1-g."
      extraction: llm_assisted_quote_verified

