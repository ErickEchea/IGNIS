  # ---------------------------------------------------------------- LPSC 2026 extended abstract
  - id: LPSC2026-1G-NOT-WORST-CASE
    claim: "NASA researchers state that microgravity research has shown normal gravity may not represent the most flammable condition, and that some materials that will not burn in 1 g will burn in 0 g with a low-speed flow or in partial gravity."
    material: "spacecraft materials (general)"
    material_class: "multiple"
    geometry: other
    gravity_range_g0: [0.0, 1.0]
    platform: model
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Review statement by NASA Glenn researchers summarizing prior drop-tower, aircraft, sounding-rocket and modeling work."
    campaign_id: LPSC-2026-REVIEW
    tags: [h2_evidence, standards_stress_test]
    provenance:
      source_id: NTRS-20260000646
      page: 1
      locator: "Introduction"
      quote: "Microgravity research over the last few decades has shown that normal gravity may not necessarily represent the most flammable condition for a material."
      extraction: llm_assisted_quote_verified

  - id: LPSC2026-SHORT-TEST-TIMES
    claim: "Partial-gravity tests in drop towers (5 s) and aircraft (~25 s) are too short to provide significant flame development."
