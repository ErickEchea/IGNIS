  - id: SACK2003-GAP-STATEMENT
    claim: "As of 2003, NASA and university researchers stated that flame spreading and material flammability had not been studied under the partial-gravity conditions of the Moon and Mars, and described their aircraft work as the beginning of that research."
    material: "solid materials (general)"
    material_class: "multiple"
    geometry: other
    gravity_range_g0: [0.16, 0.38]
    platform: parabolic_flight
    measured_variable: evidence_gap_statement
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: high
    confidence_rationale: "Explicit statement by the investigators (historical, 2003)."
    campaign_id: KC135-PARTIAL-G-GIFFTS
    tags: [evidence_gap, history]
    provenance:
      source_id: NTRS-20040053567
      page: 1
      locator: "Introduction"
      quote: "flame spreading and material flammability behavior have not been studied under the partial gravity conditions that are the natural state in space exploration destinations such as the Moon and Mars"
