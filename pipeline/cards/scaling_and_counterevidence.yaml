# Added after the independent scientific review (2026-11-14): scaling anchors and counter-evidence on
# NASA-STD-6001 Test 1 conservatism, so the Stress-Test shows both sides.

cards:
  # ---- Ferkul, Liao & Ruff (2021) "Fire on the Moon: Solid Fuel Combustion Experiments", NTRS 20210020516
  - id: FOM2021-U2-THERMAL-LENGTH
    claim: "NASA researchers estimate the characteristic buoyant speed in a flame's stabilization zone with U2 ~ g^(1/3) (thermal-length scaling): a representative flame with U2 of about 20 cm/s on Earth would have about 10 cm/s on the Moon."
    material: "representative flame (general)"
    material_class: "multiple"
    geometry: other
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio}
    platform: model
    measured_variable: buoyant_velocity_estimate
    value: {value: 10, unit: cm/s, dimension: velocity}
    comparison_1g: {value: 20, unit: cm/s, dimension: velocity}
    data_type: MODELED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Order-of-magnitude scaling in a NASA presentation; the 1-g anchor differs from other sources (33-35 cm/s)."
    campaign_id: SCALING-NASA-2021
    tags: [scaling, buoyancy, lunar]
    provenance:
      source_id: NTRS-20210020516
      page: 20
      quote: "For a representative flame on Earth having U2 ≈ 20 cm/s, the corresponding value on the moon would be U2 ≈ 10 cm/s"
      extraction: llm_assisted_quote_verified

  - id: FOM2021-U1-FIXED-LENGTH
    claim: "For a system with a fixed characteristic length, NASA researchers use U1 ~ g^(1/2) instead: a small engulfed burning sample with about 100 cm/s on Earth would have about 40 cm/s on the Moon."
    material: "small engulfed burning sample (1 cm)"
    material_class: "multiple"
    geometry: other
    gravity: {value: 0.165, unit: g, dimension: gravity_ratio}
    platform: model
    measured_variable: buoyant_velocity_estimate
    value: {value: 40, unit: cm/s, dimension: velocity}
    comparison_1g: {value: 100, unit: cm/s, dimension: velocity}
    data_type: MODELED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Order-of-magnitude scaling in a NASA presentation."
    campaign_id: SCALING-NASA-2021
    tags: [scaling, buoyancy, lunar]
    provenance:
      source_id: NTRS-20210020516
      page: 20
      quote: "if a small (1-cm), engulfed, burning sample on Earth has U1 ≈ 100 cm/s, then on the Moon the same sample would have U1 ≈ 40 cm/s"
      extraction: llm_assisted_quote_verified

  # ---- Counter-evidence and context on Test 1 conservatism
  - id: MILLER2004-TEST1-QUIESCENT
    claim: "A 2004 NASA analysis judged that a material passing NASA-STD-6001 Test 1 would most likely not burn in a quiescent microgravity environment, while noting that the degree of conservatism varies with material and cannot be determined from the test data."
    material: "spacecraft materials (general)"
    material_class: "multiple"
    geometry: other
    gravity: {value: 0, unit: g, dimension: gravity_ratio}
    flow_direction: quiescent
    platform: model
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Expert assessment (conference paper); applies to quiescent microgravity, not to partial gravity or ventilated cabins."
    caveats:
      - "Scope is quiescent microgravity; the partial-gravity evidence in this ledger concerns buoyant flow."
    campaign_id: MILLER-2004-REVIEW
    tags: [h2_counterevidence, standards_stress_test]
    provenance:
      source_id: NTRS-20040142368
      page: 4
      quote: "A material that passes this test would most likely not burn in a quiescent microgravity environment"
      extraction: llm_assisted_quote_verified

  - id: GOLDEN2007-TESTS-CONSERVATIVE
    claim: "From the ISS materials user perspective (2007), microgravity combustion findings were described as showing that the long-established material flammability test conditions are conservative."
    material: "spacecraft materials (general)"
    material_class: "multiple"
    geometry: other
    gravity: {value: 0, unit: g, dimension: gravity_ratio}
    platform: model
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "End-user assessment of microgravity findings; predates the partial-gravity drop-tower and LUCI results in this ledger."
    caveats:
      - "Refers to microgravity findings, not to lunar or Martian gravity."
    campaign_id: GOLDEN-2007-REVIEW
    tags: [h2_counterevidence, standards_stress_test]
    provenance:
      source_id: NTRS-20070018274
      page: 1
      quote: "they show that the long-established test conditions used for the evaluation of materials flammability are conservative"
      extraction: llm_assisted_quote_verified

  - id: OF2012-MODIFIED-PROTOCOL
    claim: "The 1-g limits in Olson & Ferkul (2012) come from a modified Test 1 protocol: a hot-wire igniter replaced the 25-s chemical igniter, and the atmosphere was varied to find limits rather than run a single pass/fail test."
    material: "Mylar G (Melinex 515 in 1 g), Ultem 1000, Nomex HT90-40"
    material_class: "multiple"
    geometry: other
    gravity: {value: 1, unit: g, dimension: gravity_ratio}
    platform: ground_1g
    measured_variable: methodological_limitation
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: high
    confidence_rationale: "Explicit description by the authors."
    campaign_id: WSTF-1G-MODIFIED-TEST1
    tags: [limitation, standards_stress_test]
    provenance:
      source_id: NTRS-20130010991
      page: 4
      quote: "The NASA WSTF tests were conducted using the STD-6001 Test 1 protocol except a hot wire igniter is used to ignite the samples instead of a chemical igniter"
      extraction: llm_assisted_quote_verified

  - id: LPSC2026-TEST1-ASSUMPTION
    claim: "NASA-STD-6001B Test 1 is conducted in normal Earth gravity, with the assumption that a material passing the 1-g test is considered safe for spaceflight."
    material: "spacecraft materials (general)"
    material_class: "standard test"
    geometry: other
    gravity: {value: 1, unit: g, dimension: gravity_ratio}
    platform: ground_1g
    measured_variable: test_condition
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: high
    confidence_rationale: "Description of current practice by NASA researchers."
    campaign_id: NASA-STD-6001-TEST1
    tags: [standards_stress_test]
    provenance:
      source_id: NTRS-20260000646
      page: 1
      quote: "The test is conducted in normal Earth gravity, with the assumption that if a material passes the 1-g test, then it is considered safe for spaceflight."
      extraction: llm_assisted_quote_verified
