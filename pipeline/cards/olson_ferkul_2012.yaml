# Olson S.L. & Ferkul P.V. (2012) "Evaluating Material Flammability in Microgravity and Martian
# Gravity Compared to the NASA Standard Normal Gravity Test", 42nd ICES, AIAA. NTRS 20130010991.
# Table I (page 6) transcribed row by row; each row quote is verified against the PDF page text.
# Lunar-g and 0g rows are reproduced by the authors from Ferkul & Olson (2011), their ref. 8.

tables:
  - id_prefix: OF2012
    source_id: NTRS-20130010991
    page: 6
    locator: "Table I"
    extraction: llm_assisted_quote_verified
    defaults:
      tags: [upward_flammability_limit, nasa_std_6001_test1_modified, partial_gravity]
      flow_direction: concurrent
    columns:
      - key: MYLAR
        label: "Mylar G (10.2 psia)"
        material: "Mylar G / Melinex 515 PET film"
        material_class: "polyester film (non-charring, melting)"
        geometry: thin_sheet
        thickness: {value: 5, unit: mil, dimension: length}
        pressure: {value: 10.2, unit: psi, dimension: pressure}
      - key: ULTEM
        label: "Ultem 1000 (10.2 psia)"
        material: "Ultem 1000 polyetherimide film"
        material_class: "fire-retarded polyetherimide film (charring)"
        geometry: thin_sheet
        thickness: {value: 10, unit: mil, dimension: length}
        pressure: {value: 10.2, unit: psi, dimension: pressure}
      - key: NOMEX
        label: "Nomex HT90-40 (14.7 psia)"
        material: "Nomex HT90-40 fabric"
        material_class: "aramid fabric (charring)"
        geometry: fabric
        thickness: {value: 12, unit: mil, dimension: length}
        pressure: {value: 14.7, unit: psi, dimension: pressure}
    rows:
      - key: 1G-ULOI
        label: "1g ULOI"
        quote: "1g ULOI 21.2 23.5 23.5"
        values: [21.2, 23.5, 23.5]
        unit: "%"
        dimension: fraction
        measured_variable: upward_limiting_oxygen_index
        claim: "{material}: 1-g upward limiting oxygen index (ULOI) = {value}% O2 (modified NASA-STD-6001 Test 1, hot-wire ignition, NASA White Sands Test Facility)."
        gravity: {value: 1, unit: g, dimension: gravity_ratio}
        platform: ground_1g
        flow_direction: buoyant_upward
        campaign_id: WSTF-1G-MODIFIED-TEST1
        data_type: MEASURED
        epistemic: DOCUMENTED_FACT
        confidence: high
        confidence_rationale: "Repeated 1-g tests under a documented modified Test 1 protocol (ULOI = O2 at which a material passes about half the time)."
      - key: 1G-MOC
        label: "1g MOC"
        quote: "1g MOC 20.0 23.0 22.1"
        values: [20.0, 23.0, 22.1]
        unit: "%"
        dimension: fraction
        measured_variable: maximum_oxygen_concentration
        claim: "{material}: 1-g maximum oxygen concentration (MOC) = {value}% O2 (modified NASA-STD-6001 Test 1, hot-wire ignition)."
        gravity: {value: 1, unit: g, dimension: gravity_ratio}
        platform: ground_1g
        flow_direction: buoyant_upward
        campaign_id: WSTF-1G-MODIFIED-TEST1
        data_type: MEASURED
        epistemic: DOCUMENTED_FACT
        confidence: high
        confidence_rationale: "MOC defined as O2 where at least five samples pass and at least one fails at +1% O2 (p. 2)."
      - key: MARS-ULOI
        label: "Martian ULOI*"
        quote: "Martian ULOI* 18.0 22.0 19.9"
        values: [18.0, 22.0, 19.9]
        unit: "%"
        dimension: fraction
        measured_variable: upward_limiting_oxygen_index
        claim: "{material}: Martian-gravity ULOI* = {value}% O2 (lowest O2 at which the flame survived the full 5.18 s drop)."
        gravity: {value: 0.38, unit: g, dimension: gravity_ratio}
        platform: drop_tower_centrifuge
        reduced_gravity_duration_s: 5.18
        campaign_id: GRC-ZGF-CENTRIFUGE-MARS
        data_type: MEASURED
        epistemic: DOCUMENTED_FACT
        confidence: medium
        confidence_rationale: "5.18 s drop-tower centrifuge tests (30.8 rpm) at 1% O2 increments; low-g criteria differ from 1-g criteria."
        caveats:
          - "ULOI*/MOC* are defined over the 5.18 s drop time, not the 1-g Test 1 criteria (p. 4, p. 6)."
          - "Nomex and Ultem flames were shrinking at the end of the drop; the authors note they might have extinguished given more time (p. 4)."
      - key: MARS-MOC
        label: "Martian MOC*"
        quote: "Martian MOC* 17.0 21.1 19.0"
        values: [17.0, 21.1, 19.0]
        unit: "%"
        dimension: fraction
        measured_variable: maximum_oxygen_concentration
        claim: "{material}: Martian-gravity MOC* = {value}% O2 (highest O2 at which the flame self-extinguished during the 5.18 s drop)."
