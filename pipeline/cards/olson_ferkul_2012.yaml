cards:
  - id: OF2012-INTERP-NOT-CONSERVATIVE
    claim: "The authors conclude that normal-gravity material flammability screening tests may not be conservative for low gravity, and that a 1-g factor of safety may be needed if the trend is proven for more materials."
    material: "Mylar G, Ultem 1000, Nomex HT90-40"
    material_class: "multiple"
    geometry: other
    gravity_range_g0: [0.0, 0.38]
    platform: drop_tower_centrifuge
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Three materials, short drop tests; the authors themselves condition the conclusion on testing more materials."
    caveats:
      - "Based on three materials only."
      - "Low-g extinction criteria differ from 1-g criteria because of the 5.18 s drop time."
    campaign_id: GRC-ZGF-CENTRIFUGE-MARS
    tags: [h2_evidence, standards_stress_test]
    provenance:
      source_id: NTRS-20130010991
      page: 8
      locator: "IV. Conclusions"
      quote: "normal gravity material flammability screening tests may not be conservative and some materials tested to be safe for use in space may actually be flammable"
      extraction: llm_assisted_quote_verified

  - id: OF2012-CAVEAT-CRITERIA
    claim: "Low-gravity extinction-limit criteria in these drop tests are not the same as the 1-g Test 1 criteria, because of the limited drop time."
    material: "Mylar G, Ultem 1000, Nomex HT90-40"
    material_class: "multiple"
    geometry: other
    gravity_range_g0: [0.0, 0.38]
    platform: drop_tower_centrifuge
    reduced_gravity_duration_s: 5.18
    measured_variable: methodological_limitation
    data_type: DERIVED
    epistemic: DOCUMENTED_FACT
    confidence: high
    confidence_rationale: "Explicit statement by the authors."
    campaign_id: GRC-ZGF-CENTRIFUGE-MARS
    tags: [limitation, short_duration]
    provenance:
      source_id: NTRS-20130010991
      page: 6
      locator: "Section III, after Eq. (1)"
      quote: "It should be noted that the low g extinction limit criteria are not the same as 1g due to time constraints in drop testing."
      extraction: llm_assisted_quote_verified

  - id: OF2012-INTERP-CHARRING
    claim: "For the charring fuels (Nomex, Ultem) the microgravity oxygen margin is close to zero, while in lunar gravity it is about 2.5% O2 lower than in 1 g; the authors suggest adequate but not excessive convection makes materials burn better."
    material: "Ultem 1000, Nomex HT90-40"
    material_class: "charring polymers"
    geometry: other
    gravity_range_g0: [0.0, 0.165]
    platform: drop_tower_centrifuge
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Mechanistic interpretation by the authors, consistent with flammability-map theory (T'ien 1986), not separately tested here."
    campaign_id: GRC-ZGF-CENTRIFUGE-LUNAR
    tags: [mechanism, partial_gravity]
    provenance:
      source_id: NTRS-20130010991
      page: 7
      locator: "Section III, discussion of Fig. 6"
      quote: "In Lunar gravity, the oxygen margin of safety for these charring fuels is ~ 2.5% lower than 1g. It may be that with adequate but not excessive convection, materials burn better, as predicted by flammability maps."
      extraction: llm_assisted_quote_verified

  - id: OF2012-INTERP-DRIPPING
    claim: "For non-charring, melting Mylar, the absence of gravity-induced dripping keeps molten fuel in the flame zone, giving a significantly negative oxygen margin (about 4-5% O2) at Martian, lunar and zero gravity."
    material: "Mylar G"
    material_class: "polyester film (non-charring, melting)"
    geometry: thin_sheet
    gravity_range_g0: [0.0, 0.38]
    platform: drop_tower_centrifuge
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: medium
    confidence_rationale: "Mechanism proposed by the authors by analogy with metals combustion; not directly measured."
    campaign_id: GRC-ZGF-CENTRIFUGE-MARS
    tags: [mechanism, dripping]
    provenance:
      source_id: NTRS-20130010991
      page: 7
      locator: "Section III"
      quote: "the absence of gravitational-induced dripping keeps heated molten fuel in the flame zone rather than removing it, and the result is a significantly negative oxygen margin of safety (~4-5%) in Martian, Lunar, and 0g."
      extraction: llm_assisted_quote_verified

  - id: OF2012-INTERP-U-SHAPE
    claim: "For Mylar, the limiting oxygen concentration versus gravity level suggests a range of g-levels within which a flame can survive (a U-shaped flammability boundary), but the exact curve shape and its minimum are not known because data are sparse."
    material: "Mylar G"
    material_class: "polyester film (non-charring, melting)"
    geometry: thin_sheet
    gravity_range_g0: [0.0, 1.0]
    platform: drop_tower_centrifuge
    measured_variable: interpretation
    data_type: DERIVED
    epistemic: SCIENTIFIC_INTERPRETATION
    confidence: low
    confidence_rationale: "The authors state the curve shapes and absolute minimums are unknown given the sparsity of points (p. 8)."
    caveats:
      - "Given the sparsity of points, the exact shapes of the curves are not known, nor are the absolute minimums (p. 8)."
    campaign_id: GRC-ZGF-CENTRIFUGE-MARS
    tags: [u_shaped_boundary, partial_gravity, evidence_gap]
    provenance:
      source_id: NTRS-20130010991
      page: 7
      locator: "Fig. 7 discussion"
      quote: "There appears to be a range of g-levels within which a flame can survive."
      extraction: llm_assisted_quote_verified

  - id: OF2012-ATMOS-TEST1-CONDITION
    claim: "NASA-STD-6001 Test 1 is a pass/fail upward flame propagation test run in the most severe expected atmosphere; at the time, the ISS pre-EVA environment of 30% O2 at 10.2 psia."
    material: "any spacecraft material"
    material_class: "standard test"
    geometry: other
    gravity: {value: 1, unit: g, dimension: gravity_ratio}
    o2: {value: 30, unit: "%", dimension: fraction}
    pressure: {value: 10.2, unit: psi, dimension: pressure}
    platform: ground_1g
    flow_direction: buoyant_upward
    measured_variable: test_condition
    data_type: MEASURED
    epistemic: DOCUMENTED_FACT
    confidence: high
    confidence_rationale: "Statement of the standard test practice by NASA authors."
    campaign_id: NASA-STD-6001-TEST1
    tags: [standards_stress_test, atmosphere]
    provenance:
      source_id: NTRS-20130010991
      page: 1
      locator: "I. Introduction"
      quote: "currently 30% oxygen at 10.2 psia which is the pre-breath environment on the ISS for spacewalks"
      extraction: llm_assisted_quote_verified
