        epistemic: DOCUMENTED_FACT
        confidence: medium
        confidence_rationale: "Short drop tests with a forced concurrent flow of 30 cm/s, described by the authors as a reasonable maximum spacecraft ventilation velocity (p. 4)."
      - key: 0G-MOC
        label: "0g* MOC*"
        quote: "0g* MOC* 16.0 23.0 22.0"
        values: [16.0, 23.0, 22.0]
        unit: "%"
        dimension: fraction
        measured_variable: maximum_oxygen_concentration
        claim: "{material}: microgravity MOC* = {value}% O2 with a 30 cm/s concurrent forced flow (drop tower)."
