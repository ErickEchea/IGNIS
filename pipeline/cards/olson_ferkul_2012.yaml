      - key: 0G-ULOI
        label: "0g* ULOI*"
        quote: "0g* ULOI* 17.0 24.0 23.0"
        values: [17.0, 24.0, 23.0]
        unit: "%"
        dimension: fraction
        measured_variable: upward_limiting_oxygen_index
        claim: "{material}: microgravity ULOI* = {value}% O2 with a 30 cm/s concurrent forced flow (drop tower)."
        gravity: {value: 0, unit: g, dimension: gravity_ratio, uncertainty_kind: unknown}
