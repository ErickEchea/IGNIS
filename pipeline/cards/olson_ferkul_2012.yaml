      - key: LUNAR-ULOI
        label: "Lunar ULOI*"
        quote: "Lunar ULOI* 15.6 21.0 21.0"
        values: [15.6, 21.0, 21.0]
        unit: "%"
        dimension: fraction
        measured_variable: upward_limiting_oxygen_index
        claim: "{material}: lunar-gravity ULOI* = {value}% O2 (drop-tower centrifuge; data from Ferkul & Olson 2011 as tabulated by Olson & Ferkul 2012)."
        gravity: {value: 0.165, unit: g, dimension: gravity_ratio, uncertainty_kind: unknown}
        platform: drop_tower_centrifuge
        reduced_gravity_duration_s: 5.18
        campaign_id: GRC-ZGF-CENTRIFUGE-LUNAR
        data_type: MEASURED
        epistemic: DOCUMENTED_FACT
        confidence: medium
        confidence_rationale: "Short (5.18 s) drop tests; values reproduced from ref. 8 of the source."
        caveats:
          - "Exact centrifuge g-level of the lunar tests is not stated in this source; 0.165 g (NSSDC lunar gravity) is used for plotting."
          - "ULOI*/MOC* are defined over the drop time, not the 1-g Test 1 criteria."
      - key: LUNAR-MOC
        label: "Lunar MOC*"
        quote: "Lunar MOC* 14.1 19.9 19.9"
        values: [14.1, 19.9, 19.9]
        unit: "%"
        dimension: fraction
        measured_variable: maximum_oxygen_concentration
        claim: "{material}: lunar-gravity MOC* = {value}% O2 (drop-tower centrifuge; data from Ferkul & Olson 2011 as tabulated by Olson & Ferkul 2012)."
        gravity: {value: 0.165, unit: g, dimension: gravity_ratio, uncertainty_kind: unknown}
        platform: drop_tower_centrifuge
